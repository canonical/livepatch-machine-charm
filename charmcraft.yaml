# https://juju.is/docs/sdk/charmcraft-config
type: "charm"

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    charm-strict-dependencies: true
    charm-binary-python-packages:
      - anyio
      - bcrypt
      - certifi
      - cffi
      - charset-normalizer
      - cosl
      - exceptiongroup
      - h11
      - httpcore
      - httpx
      - idna
      - lightkube
      - lightkube-models
      - macaroonbakery
      - ops
      - ops-lib-pgsql
      - pgconnstr
      - protobuf
      - pycparser
      - pydantic
      - pymacaroons
      - PyNaCl
      - pyRFC3339
      - pytz
      - PyYAML
      - requests
      - six
      - sniffio
      - tenacity
      - typing_extensions
      - urllib3
      - websocket-client
